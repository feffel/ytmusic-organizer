repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: ensure-up-to-date-base
        name: Ensure branch includes latest default branch
        entry: ./scripts/git/ensure-up-to-date-base.sh origin
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: verify-before-push
        name: Verify lint and tests before push
        entry: make verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
