[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-organizer"
version = "0.1.0"
description = "Organize YouTube Music likes into playlists with guided bootstrap and weekly sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ytmusic-organizer contributors" }]
dependencies = [
  "requests>=2.32.0",
  "ytmusicapi>=1.11.0",
  "openai>=1.0.0",
]

[project.scripts]
ytmo = "ytmusic_organizer.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ytmusic_organizer*"]

[tool.setuptools.package-data]
ytmusic_organizer = ["prompts/*.txt"]
