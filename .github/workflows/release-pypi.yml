name: Release PyPI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  id-token: write

jobs:
  gate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail

          head_sha="${{ github.event.workflow_run.head_sha }}"
          mapfile -t tags < <(git tag --points-at "$head_sha" "v*" | sort)
          count="${#tags[@]}"

          if [ "$count" -eq 0 ]; then
            echo "No v* tag found for ${head_sha}; skipping publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$count" -gt 1 ]; then
            echo "Ambiguous release target: multiple v* tags found for ${head_sha}:"
            printf '%s\n' "${tags[@]}"
            exit 1
          fi

          echo "Resolved release tag: ${tags[0]}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tags[0]}" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Check distribution
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/*
            artifacts/demo/*.gif
            artifacts/demo/*.mp4
          fail_on_unmatched_files: false
