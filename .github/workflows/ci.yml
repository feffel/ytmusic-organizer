name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install . --force
      - name: CLI smoke checks
        run: |
          ytmo --help
          ytmo cleanup --workspace /tmp/ytmo-smoke --local-only --yes --json
          ytmo stats --workspace /tmp/ytmo-smoke --json

  repo-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard tracked demo media
        run: |
          tracked_media="$(git ls-files '*.cast' '*.gif' '*.mp4')"
          if [ -n "$tracked_media" ]; then
            echo "Tracked media files are not allowed:"
            echo "$tracked_media"
            exit 1
          fi
